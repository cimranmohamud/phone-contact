<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Contact</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center p-6">

<div class="bg-white w-full max-w-md rounded-xl shadow-lg p-5">

  <h1 class="text-2xl font-bold text-center mb-4">
    Phone Contact
  </h1>

  <!-- Search -->
  <input
    id="search"
    type="text"
    placeholder="Search contact..."
    class="w-full border rounded-lg p-2 mb-4"
  >

  <!-- Name -->
  <input
    id="name"
    type="text"
    placeholder="Enter Name"
    class="w-full border rounded-lg p-2 mb-3"
  >

  <!-- Phone -->
  <input
    id="phone"
    type="text"
    placeholder="Enter Phone Number"
    class="w-full border rounded-lg p-2 mb-3"
  >

  <!-- Save Button -->
  <button
    id="saveBtn"
    class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700">
    Save Contact
  </button>

  <!-- Contact List -->
  <div id="contactList" class="mt-5 space-y-3"></div>

</div>

<script src="script.js"></script>

</body>
</html>
